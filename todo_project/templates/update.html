<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Update Task</h2>
    <form method="POST">
    {% csrf_token %}
        <label for="id_title">Task Title</label>
        {{form.title}}

        <div class="checkbox">
            {{form.completed}} <label for="id_completed"></label>
        </div>
        <button type="submit">Save</button>
    </form>
    <a href="/">Back</a>
</body>
</html>
